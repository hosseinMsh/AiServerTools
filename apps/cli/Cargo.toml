[package]
name = "infra-core-cli"
version = "0.1.0"
edition = "2021"
description = "InfraCore CLI - enterprise infrastructure management from the terminal"

[[bin]]
name = "infra"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
ssh-engine = { path = "../../packages/core/ssh-engine" }
docker-engine = { path = "../../packages/core/docker-engine" }
sftp-engine = { path = "../../packages/core/sftp-engine" }
tunnel-engine = { path = "../../packages/core/tunnel-engine" }
security = { path = "../../packages/core/security" }
audit = { path = "../../packages/core/audit" }
context-engine = { path = "../../packages/core/context-engine" }
ai-engine = { path = "../../packages/ai-engine" }
