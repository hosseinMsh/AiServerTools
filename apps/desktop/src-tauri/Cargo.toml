[package]
name = "infra-core-desktop"
version = "0.1.0"
edition = "2021"
description = "InfraCore Desktop - Enterprise SSH & Infrastructure Control Platform"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
tauri = { version = "1", features = ["shell-open"] }

ssh-engine = { path = "../../../packages/core/ssh-engine" }
docker-engine = { path = "../../../packages/core/docker-engine" }
sftp-engine = { path = "../../../packages/core/sftp-engine" }
tunnel-engine = { path = "../../../packages/core/tunnel-engine" }
security = { path = "../../../packages/core/security" }
audit = { path = "../../../packages/core/audit" }
context-engine = { path = "../../../packages/core/context-engine" }
ai-engine = { path = "../../../packages/ai-engine" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
